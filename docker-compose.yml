services:
  api:
    build:
      context: apps/api
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
    init: true
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"

  worker:
    build:
      context: apps/worker
    volumes:
      - ./apps/worker:/app
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  traefik:
    image: traefik:3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--tracing=true"
      - "--tracing.otlp.http=true"
      - "--tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces"
    ports:
      - 3000:80
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - 16686:16686
      - 16687:16687
      - 4317:4317
      - 4318:4318