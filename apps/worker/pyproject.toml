[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pika>=1.4.1",
    "python-dotenv>=1.2.2",
    "pytest>=8.0.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]

[tool.mypy]
files = ["src"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true